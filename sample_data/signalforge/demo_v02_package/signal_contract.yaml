signal_name: sf_v02_demo
version: 0.2.0
source: SignalForge
factor:
  name: sf_v02_demo_factor
  version: 0.1.0
  parameters: {}
decision_rule:
  score: SignalForge producer score
  direction: sign(score)
  target_weight: signed no-leverage target exposure consumed by AlphaForge custom_signal v0.2
data:
  required_columns:
  - datetime
  - open
  - high
  - low
  - close
  - volume
  - symbol
timing:
  available_at_rule: same declared daily trading date as datetime for deterministic sample data
output:
  file: signal.csv
  schema_version: v0.2
  columns:
  - datetime
  - available_at
  - symbol
  - signal_name
  - score
  - direction
  - target_weight
  - source
  row_count: 4
compatibility:
  alphaforge_strategy: custom_signal
  alphaforge_custom_signal_version: v0.2
  expected_execution_semantics: signed_close_to_close_lagged
  requires_alphaforge_runtime: true
  signalforge_import_required_by_alphaforge: false
symbols:
- SFDEMO
datetime_range:
  start: '2025-01-02'
  end: '2025-01-07'
