[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaforge"
version = "0.1.0"
description = "Research-oriented asset-pricing and strategy-validation toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.0.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "plotly>=5.24",
    "pyarrow>=14",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "ruff>=0.5",
]
dashboard = [
    "streamlit>=1.35",
]
sklearn = [
    "scikit-learn>=1.3",
]
torch = [
    "torch>=2.1",
]

[project.scripts]
alphaforge = "alphaforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/run_signalforge_batch_package_smoke.py" = ["E402"]
"src/alphaforge/dashboard_ml_predictions.py" = ["F401"]
"src/alphaforge/runner_workflows.py" = ["F601"]
"tests/test_backtest.py" = ["F401"]
